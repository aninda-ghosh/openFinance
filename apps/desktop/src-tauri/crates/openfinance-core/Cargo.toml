[package]
name = "openfinance-core"
version = "0.1.0"
edition = "2021"
description = "openFinance backend: the API server the desktop app runs in-process"
publish = false

[lib]
name = "openfinance_core"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
chrono = "0.4.45"
hex = "0.4.3"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tracing = "0.1.44"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
icu_collator = "2.4.0"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
