[package]
name = "openfinance-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openfinance_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
openfinance-core = { path = "crates/openfinance-core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
zeroize = { version = "1", features = ["std"] }

# Touch ID unlock (macOS only): the passcode lives in a login-keychain item and
# the app checks Touch ID (LocalAuthentication) before reading it.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", default-features = false }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext"] }

[dev-dependencies]
tempfile = "3.27.0"

# Cargo workspace: this Tauri app crate plus the backend crates under crates/.
[workspace]
members = ["crates/*"]
resolver = "2"

